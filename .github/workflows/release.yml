name: Release

# Pushing a tag like v0.1.0 builds the module and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build the zip and the manifest
        run: pnpm release

      - name: Release notes from the changelog
        run: |
          awk -v v="# $VERSION" '$0 == v {on=1; next} /^# / {on=0} on' changelog.md > notes.md
          cat notes.md

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p "require('./package.json').name")
          gh release create "$GITHUB_REF_NAME" "package/$name.zip" package/module.json \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

      # Only runs once the secret FOUNDRY_RELEASE_TOKEN is set, the package has to exist on foundryvtt.com already.
      - name: Tell the Foundry package registry
        if: env.FOUNDRY_RELEASE_TOKEN != ''
        run: |
          jq -n --slurpfile m package/module.json \
            --arg manifest "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/module.json" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            '{id: $m[0].id, release: {version: $m[0].version, manifest: $manifest, notes: $notes, compatibility: $m[0].compatibility}}' \
            > foundry.json
          cat foundry.json
          curl --fail-with-body -sS -X POST "https://foundryvtt.com/_api/packages/release_version/" \
            -H "Content-Type: application/json" \
            -H "Authorization: $FOUNDRY_RELEASE_TOKEN" \
            -d @foundry.json
